name: Sync verified Neon data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neon-data-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exporter dependency
        run: pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify Neon secret
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "Missing repository secret NEON_DATABASE_URL"
            exit 1
          fi
      - name: Export properties, grants and intelligence
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/export_neon.py
      - name: Write sync status
        run: |
          printf '{"generatedAt":"%s","source":"Neon Postgres","status":"verified-export"}\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > data/sync-status.json
      - name: Commit changed data snapshots
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "sakura-sync[bot]"
          git config user.email "sakura-sync[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: sync Neon property intelligence"
          git push
